name: ribo_genome
channels:
  - conda-forge
  - bioconda
# Exact-pinned for reproducibility: versions below are the actual solved
# environment extracted from the danielnguyener/riboflow:0.0.2 image
# (`conda list -n ribo_genome`), not aspirational ranges. Regenerate by
# rebuilding the image and re-running that command if dependencies change.
# Note: nextflow here is 26.04.2, one patch behind the 26.04.3 previously
# pinned in this file — the image was built before that bump; confirm which
# is the intended reproducible version before relying on this for a release.
dependencies:
  # Nextflow >=24.10 runs the DSL2 pipeline and requires Java 17+. That same
  # JDK also satisfies umicollapse (>=17), so one runtime serves the whole
  # pipeline — no more separate Java 8 (DSL1) + Java 11 (umicollapse) split.
  - nextflow=26.04.2
  - openjdk=23.0.2
  # umicollapse is now packaged on bioconda (CLI entrypoint `umicollapse`),
  # replacing the hand-shipped umicollapse.jar + `java11` wrapper. It pulls in
  # its own openjdk>=17. The dedup step calls `umicollapse bam ...` directly.
  - umicollapse=1.1.0
  - python=3.12.13
  - samtools=1.23
  - fastqc=0.12.1
  - setuptools=82.0.1
  - pip=26.1.1
  - numpy=1.26.4
  - pandas=3.0.3
  - scipy=1.17.1
  - matplotlib=3.10.9
  - bowtie2=2.5.5
  - star=2.7.11b
  - bx-python=0.14.0
  - pysam=0.24.0
  - bedtools=2.31.1
  - cutadapt=5.2
  - deeptools=3.5.5
  - ucsc-bedgraphtobigwig=482
  # umi_tools (underscore) is the bioconda package name; on PyPI it's umi-tools.
  - umi_tools=1.1.6
  - pip:
    # Pinned to the exact commits resolved in the image (via `pip freeze`),
    # not upstream main — reproducible builds should stay on these SHAs and
    # bump deliberately.
    - git+https://github.com/ribosomeprofiling/ribopy.git@380421e202f25a9829b36c1c1d5a8bf333d9188f
    - git+https://github.com/DanielNguyener/RFCommands_genome.git@c194f7691591636c53e4407cb18f611017f9edd8
# rebuilt: numpy<2 pin
